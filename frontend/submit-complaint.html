<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Complaint</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/student/dashboard">🎓 Complaint Portal</a>
    <div class="links">
      <a href="/student/dashboard">Dashboard</a>
      <a href="/student/complaints">My Complaints</a>
      <a href="/student/complaints/new" class="active">Submit</a>
      <a href="/student/profile">Profile</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h1 class="page">Submit Complaint</h1>
      <p class="sub">Status starts as <b>Pending</b>. The admin will update it and add a response.</p>
      <label for="title">Title <span class="req">*</span></label>
      <input id="title" type="text" placeholder="e.g. Fan not working" maxlength="150">
      <label for="cat">Category <span class="req">*</span></label>
      <select id="cat">
        <option value="">-- Select --</option>
        <option>Academic</option><option>Infrastructure</option><option>Hostel</option>
        <option>Library</option><option>Canteen</option><option>Other</option>
      </select>
      <label for="desc">Description <span class="req">*</span></label>
      <textarea id="desc" placeholder="Describe the issue clearly…" maxlength="5000"></textarea>
      <div id="err" class="alert error"></div>
      <div id="ok" class="alert ok"></div>
      <button id="btn" class="btn" onclick="submitComplaint()">Submit Complaint</button>
      <a class="btn ghost" href="/student/complaints">Back to My Complaints</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/student.js"></script>
  <script>requireRole("STUDENT");</script>
</body>
</html>
