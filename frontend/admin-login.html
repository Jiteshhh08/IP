<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🎓 College Complaint Portal</a>
    <div class="links"><a href="/">Home</a><a href="/login">Student</a></div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="card">
        <h1 class="page">Admin Login</h1>
        <p class="sub">Demo: <b>admin</b> / <b>admin123</b> (stored as a PBKDF2 hash in MySQL).</p>
        <label for="u">Username <span class="req">*</span></label>
        <input id="u" type="text" placeholder="admin" autocomplete="username">
        <label for="p">Password <span class="req">*</span></label>
        <input id="p" type="password" placeholder="••••••" autocomplete="current-password">
        <div id="err" class="alert error"></div>
        <button id="btn" class="btn" onclick="adminLogin()">Login</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>bindEnter(adminLogin);</script>
</body>
</html>
