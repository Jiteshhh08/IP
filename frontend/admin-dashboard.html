<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/admin/dashboard">🎓 Admin</a>
    <div class="links">
      <a href="/admin/dashboard" class="active">Dashboard</a>
      <a href="/admin/profile">Profile</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h1 class="page">Complaint Management</h1>
      <p class="sub">All complaints from MySQL. Search + filter, then View to update.</p>
      <div class="stats" id="stats"><div class="loading">Loading stats…</div></div>
      <div id="err" class="alert error"></div>
    </div>

    <div class="card">
      <h2 class="sec">Complaints</h2>
      <div class="filters">
        <input id="q" type="text" placeholder="Search by ID, student, or title…" oninput="loadAdminList()">
        <select id="fstatus" onchange="loadAdminList()">
          <option value="">All statuses</option>
          <option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option>
        </select>
        <select id="fcat" onchange="loadAdminList()">
          <option value="">All categories</option>
          <option>Academic</option><option>Infrastructure</option><option>Hostel</option>
          <option>Library</option><option>Canteen</option><option>Other</option>
        </select>
      </div>
      <div class="tbl-wrap" style="margin-top:12px"><table>
        <thead><tr><th>ID</th><th>Student</th><th>Title</th><th>Category</th><th>Date</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7"><div class="loading">Loading…</div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>loadAdminDashboard();</script>
</body>
</html>
