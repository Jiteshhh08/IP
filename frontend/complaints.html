<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Complaints</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/student/dashboard">🎓 Complaint Portal</a>
    <div class="links">
      <a href="/student/dashboard">Dashboard</a>
      <a href="/student/complaints" class="active">My Complaints</a>
      <a href="/student/complaints/new">Submit</a>
      <a href="/student/profile">Profile</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h1 class="page">My Complaints</h1>
      <p class="sub">Only your complaints, loaded from MySQL. Click View for full details + admin response.</p>
      <div id="err" class="alert error"></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th>Admin Remark</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6"><div class="loading">Loading…</div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/student.js"></script>
  <script>loadMyComplaints();</script>
</body>
</html>
