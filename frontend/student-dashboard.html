<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/student/dashboard">🎓 Complaint Portal</a>
    <div class="links">
      <a href="/student/dashboard" class="active">Dashboard</a>
      <a href="/student/complaints">My Complaints</a>
      <a href="/student/complaints/new">Submit</a>
      <a href="/student/profile">Profile</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h1 class="page" id="hello">Welcome</h1>
      <p class="sub" id="who"></p>
      <div class="stats" id="stats"><div class="loading">Loading overview…</div></div>
      <div id="err" class="alert error"></div>
      <div class="row">
        <a class="btn" href="/student/complaints/new">+ Submit Complaint</a>
        <a class="btn ghost" href="/student/complaints">View My Complaints</a>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">Recent Complaints</h2>
      <div class="tbl-wrap"><table>
        <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Date</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6"><div class="loading">Loading…</div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/student.js"></script>
  <script>loadStudentDashboard();</script>
</body>
</html>
