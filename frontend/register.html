<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Student Account</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🎓 College Complaint Portal</a>
    <div class="links"><a href="/login">Login</a><a href="/admin/login">Admin</a></div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="card">
        <h1 class="page">Create Account</h1>
        <p class="sub">Passwords are hashed (PBKDF2) — never stored in plain text.</p>
        <label for="sid">Student ID <span class="req">*</span></label>
        <input id="sid" type="text" placeholder="STU005">
        <label for="name">Full Name <span class="req">*</span></label>
        <input id="name" type="text" placeholder="Your name">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" type="text" placeholder="you@college.edu">
        <label for="pw">Password (min 6 chars) <span class="req">*</span></label>
        <input id="pw" type="password" placeholder="Choose a password" autocomplete="new-password">
        <div id="err" class="alert error"></div>
        <div id="ok" class="alert ok"></div>
        <button id="btn" class="btn" onclick="register()">Register</button>
        <div class="alt">Already registered? <a href="/login">Login</a></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
