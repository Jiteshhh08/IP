<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Complaint</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/admin/dashboard">🎓 Admin</a>
    <div class="links">
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/profile">Profile</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h1 class="page" id="head">Complaint</h1>
      <div id="info"><div class="loading">Loading…</div></div>
      <div id="err" class="alert error"></div>
    </div>

    <div class="card">
      <h2 class="sec">Update</h2>
      <label for="status">Status <span class="req">*</span></label>
      <select id="status">
        <option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option>
      </select>
      <label for="remark">Admin Response</label>
      <input id="remark" type="text" placeholder="e.g. Maintenance team has been informed." maxlength="2000">
      <div id="ok" class="alert ok"></div>
      <button id="btn" class="btn" onclick="updateComplaint()">Update Complaint</button>
      <a class="btn ghost" href="/admin/dashboard">Back to Dashboard</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>loadAdminComplaint();</script>
</body>
</html>
