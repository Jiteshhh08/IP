<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🎓 Complaint Portal</a>
    <div class="links" id="nav"></div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h1 class="page">Profile</h1>
      <div id="info"><div class="loading">Loading…</div></div>
      <div id="err" class="alert error"></div>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/student.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async function () {
      let me = null;
      try { me = await api("/api/me"); }
      catch (e) { window.location.replace("/login"); return; }
      // role-correct nav
      document.getElementById("nav").innerHTML = me.role === "ADMIN"
        ? '<a href="/admin/dashboard">Dashboard</a>'
        : '<a href="/student/dashboard">Dashboard</a><a href="/student/complaints">My Complaints</a>';
      // role-correct profile data
      if (me.role === "ADMIN") loadAdminProfile();
      else loadStudentProfile();
    })();
  </script>
</body>
</html>
