<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🎓 College Complaint Portal</a>
    <div class="links"><a href="/register">Register</a><a href="/admin/login">Admin</a></div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="card">
        <h1 class="page">Student Login</h1>
        <p class="sub">Use your Student ID or email + password.<br><span class="helper">Demo: STU001 / pass123</span></p>
        <label for="id">Student ID or Email <span class="req">*</span></label>
        <input id="id" type="text" placeholder="STU001 or rahul@college.edu" autocomplete="username">
        <label for="pw">Password <span class="req">*</span></label>
        <input id="pw" type="password" placeholder="••••••" autocomplete="current-password">
        <div id="err" class="alert error"></div>
        <button id="btn" class="btn" onclick="studentLogin()">Login</button>
        <div class="alt">New student? <a href="/register">Create an account</a></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>bindEnter(studentLogin);</script>
</body>
</html>
