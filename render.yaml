services:
  - type: web
    name: complaints-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m"
