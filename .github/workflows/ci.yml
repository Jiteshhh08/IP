name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile sources
        run: |
          mkdir -p out
          find src -name '*.java' > sources.txt
          javac -d out -cp "lib/mysql-connector-j.jar" @sources.txt
      - name: Compile tests
        run: javac -d out-test -cp out test/config/DatabaseConnectionTest.java
      - name: Run URL parsing tests
        run: java -cp "out-test:out" config.DatabaseConnectionTest

  integration:
    name: Fresh DB auto-create (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/scs_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      AUTO_CREATE_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: |
          mkdir -p out
          find src -name '*.java' > sources.txt
          javac -d out -cp "lib/mysql-connector-j.jar" @sources.txt
      - name: Start server (auto-creates + seeds the DB)
        run: |
          java -cp "out:lib/mysql-connector-j.jar" Main > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/me || true)
            if [ "$code" = "401" ]; then echo "server up"; break; fi
            sleep 2
          done
          cat server.log
      - name: Verify schema + seed
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "USE scs_ci; SHOW TABLES; SELECT COUNT(*) AS students FROM students; SELECT COUNT(*) AS complaints FROM complaints;"
