server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/student_complaint_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  seed-demo: ${SEED_DEMO:true}
